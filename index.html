.view-range{font-weight:650;color:#34425c;margin-left:5px}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}

<body>

<div class="topbar">
  <div class="brand" aria-label="Tsinghua University Research Center of Safety Control Technology">
    <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="brand-copy"><span>TSINGHUA UNIVERSITY</span><h1>安全控制技术研究中心</h1><small>RESEARCH CENTER OF SAFETY CONTROL TECHNOLOGY</small></div>
  </div>
  <div class="right" id="topRight"></div>
</div>

<div id="main">
  <!-- 内容动态渲染 -->
  <div class="empty">加载中…</div>
</div>

<!-- 弹窗容器 -->
<div id="modalRoot"></div>

<script>
// ============================================================
// 配置：把下面两个值换成你 Supabase 项目的
// Dashboard > Project Settings > API 里的 URL 和 anon key
// ============================================================
const SUPABASE_URL = 'https://grbyidfrealvpffohybu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdyYnlpZGZyZWFsdnBmZm9oeWJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODQyNDMsImV4cCI6MjEwNDI2MDI0M30.B2mHWeVvHbZwlfVIJDA_ozI-ZCqTcrkI9cmn_8wz-yU';

const sb = window.supabase
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;

// ---- 调色板（按 user_id 哈希取色，稳定）----
const PALETTE = [
  ['#4f46e5','#6366f1'],['#0ea5e9','#38bdf8'],['#16a34a','#22c55e'],
  ['#db2777','#ec4899'],['#ea580c','#f97316'],['#7c3aed','#8b5cf6'],
  ['#0891b2','#06b6d4'],['#ca8a04','#eab308'],['#dc2626','#ef4444'],
  ['#4338ca','#6366f1'],['#be185d','#f472b6']
];
function colorFor(userId, savedColor){
  if(/^#[0-9a-f]{6}$/i.test(savedColor || '')) return [savedColor, savedColor];
  let h=0; for(let i=0;i<userId.length;i++) h=(h*31+userId.charCodeAt(i))>>>0;
  return PALETTE[h%PALETTE.length];
}
function myColor(){ return state.profile?.color || colorFor(state.user?.id || '')[0]; }

// ---- 状态 ----
let state = {
  user: null,
  authReady: false,
  dataReady: false,
  profile: null,
  servers: [],
  gpus: [],          // [{id, server_id, label, server_name}]
  reservations: [],  // [{id, gpu_id, user_id, display_name, start_time, end_time, note}]
  viewCenter: new Date(), // 当前视图的锚点日期
  viewMode: 'week',       // day | week | month | year
  timelineOrigin: null,
  timelineOffset: 0,
  dateHeaderLocked: (() => { try { return localStorage.getItem('gpu-board-date-header-locked') !== 'false'; } catch { return true; } })()
};
state.viewCenter.setHours(0,0,0,0);

// ============================================================
// 入口
// ============================================================
(async function init(){
  try {
    if (!sb) throw new Error('Supabase JS SDK 未加载。');
    const { data: { session } } = await withTimeout(sb.auth.getSession(), '读取登录状态');
    if (session?.user) state.user = session.user;
    await refreshData();
    render();
    subscribeRealtime();
  } catch (err) { showLoadError(err); }
})();

function withTimeout(promise, label){
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(`${label} 超时，请检查网络后重试。`)), 15000))]);
}
async function refreshData(){
  const jobs = [loadConfig(), loadReservations()];
  if(state.user) jobs.unshift(loadProfile());
  await withTimeout(Promise.all(jobs), '加载看板数据');
}
function showLoadError(err){
  console.error('初始化失败:', err);
  document.getElementById('main').innerHTML = `<div class="empty" style="color:#dc2626"><h2>⚠️ 看板暂时无法加载</h2><p style="margin:10px 0">${esc(err?.message || String(err))}</p><button class="btn btn-primary" onclick="location.reload()">重新加载</button></div>`;
}

// ============================================================
// 数据加载
// ============================================================
async function loadProfile(){
  const { data } = await sb.from('profiles').select('*').eq('user_id', state.user.id).maybeSingle();
  state.profile = data;
}

async function loadConfig(){
  const [{data: servers, error: serverError}, {data: gpus, error: gpuError}] = await Promise.all([
    sb.from('servers').select('*').order('id'),
    sb.from('gpus').select('*, servers(name)').order('slot_index')
  ]);
  if(serverError) throw serverError; if(gpuError) throw gpuError;
  state.servers = servers || [];
  // 按 server_id 再 slot_index 稳定排序（保险起见在 JS 里再排一次）
  state.gpus = (gpus||[])
    .map(g => ({...g, server_name: g.servers?.name}))
    .sort((a,b) => a.server_id - b.server_id || a.slot_index - b.slot_index);
}

async function loadReservations(){
  // reservations 与 profiles 都关联 auth.users，不能在 PostgREST 中直接嵌套联表。
  const { data: reservations, error: reservationError } = await sb.from('reservations').select('*').order('start_time');
  if(reservationError) throw reservationError;
  let { data: profiles, error: profileError } = await sb.from('profiles').select('user_id, display_name, color');
  // 部署先于数据库迁移时，仍保持看板可用；迁移完成后自动读取共享颜色。
  if(profileError && /color|column/i.test(profileError.message || '')) {
    ({ data: profiles, error: profileError } = await sb.from('profiles').select('user_id, display_name'));
  }
  if(profileError) throw profileError;
  const names = new Map((profiles || []).map(p => [String(p.user_id), p]));
  state.reservations = (reservations || []).map(r => ({
    ...r, display_name: names.get(String(r.user_id))?.display_name || '未知',
    color: names.get(String(r.user_id))?.color || null
  }));
}
// ============================================================
// Realtime 订阅
// ============================================================
function subscribeRealtime(){
  sb.channel('reservations-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'reservations' }, async () => {
      await loadReservations(); renderMain();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => {
      await loadReservations(); renderMain();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'gpus' }, async () => {
      await loadConfig(); renderMain();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'servers' }, async () => {
      await loadConfig(); renderMain();
    })
    .subscribe();
}

// ============================================================
// 渲染
// ============================================================
function render(){
  renderTop();
  renderMain();
}

function renderTop(){
  const el = document.getElementById('topRight');
  if(!state.authReady){ el.innerHTML = ''; return; }
  if (state.user) {
    el.innerHTML = `
      <span class="muted">${state.profile?.display_name || state.user.email}</span>
      <button class="btn btn-sm" onclick="openProfileModal()">改名</button>
      <button class="btn btn-sm" onclick="signOut()">退出</button>
    `;
  } else {
    el.innerHTML = `<span class="muted">未登录</span>`;
  }
}

function renderMain(){
  const el = document.getElementById('main');
  if(!state.authReady || (state.user && !state.dataReady)){ el.innerHTML = '<div class="empty">正在恢复登录状态…</div>'; return; }
  if (!state.user) { el.innerHTML = authHtml(); return; }
  if (!state.profile) { el.innerHTML = profilePromptHtml(); return; }
  el.innerHTML = boardHtml();
}

// ---- 登录界面 ----
function authHtml(){
  return `
    <div class="auth-box">
      <h2>登录 / 注册</h2>
      <p class="muted">输入邮箱，我们会发一封魔法链接邮件给你，点击即可登录。</p>
      <input id="loginEmail" type="email" placeholder="your@email.com">
      <button class="btn btn-primary" id="sendBtn" onclick="sendMagicLink()">发送登录链接</button>
      <div class="msg" id="loginMsg"></div>
      <div style="margin:16px 0;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px">
        <span style="flex:1;height:1px;background:var(--border)"></span>或<span style="flex:1;height:1px;background:var(--border)"></span>
      </div>
      <button class="btn" onclick="signInWithGithub()" style="width:100%;padding:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        用 GitHub 登录
      </button>
      <div class="msg muted" style="font-size:12px">GitHub 登录不走邮件，不受邮箱限流影响。</div>
    </div>`;
}

// ---- 首次填名字 ----
function profilePromptHtml(){
  return `
    <div class="auth-box">
      <h2>首次使用，请填你的名字</h2>
      <p class="muted">看板上会显示这个名字，方便大家认领预约。</p>
      <input id="profName" type="text" placeholder="如：张三" maxlength="20">
      <button class="btn btn-primary" onclick="saveProfile()">保存</button>
    </div>`;
}

// ---- 看板主体 ----
function boardHtml(){
  if(!state.gpus.length)return `<div class="empty">尚未配置 GPU 资源。请先在 Supabase 中运行 schema.sql。</div>`;
  const view=getViewWindow(),now=new Date();
  const active=state.gpus.filter(g=>state.reservations.some(r=>String(r.gpu_id)===String(g.id)&&new Date(r.start_time)<=now&&new Date(r.end_time)>now)).length;
  let booked=0;state.reservations.filter(r=>new Date(r.end_time)>view.start&&new Date(r.start_time)<view.end).forEach(r=>booked+=(Math.min(new Date(r.end_time),view.end)-Math.max(new Date(r.start_time),view.start))/36e5);
  return `<div class="app-shell"><div class="dashboard-head"><div><div class="eyebrow"><span>COMPUTE RESOURCE OPERATIONS</span><em>·</em> RCSCT</div><h2>GPU 资源协调平台</h2></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="manualRefresh()">↻ 刷新</button><button class="btn" onclick="openManageModal()">管理我的预约</button><button class="btn btn-primary" onclick="openReserveModal()">＋ 新建预约</button></div></div><div class="metrics"><div class="metric"><span>▦ 资源总数</span><b>${state.gpus.length}</b><small>${state.servers.length} 台服务器</small></div><div class="metric"><span>● 此刻可用</span><b>${state.gpus.length-active}</b><small>当前没有进行中的预约</small></div></div><div class="board-panel ${state.dateHeaderLocked?'date-header-locked':''}"><div class="toolbar"><div class="view-switcher">${[['day','日'],['week','周'],['month','月'],['year','年']].map(([m,l])=>`<button class="btn btn-sm ${state.viewMode===m?'active':''}" onclick="setViewMode('${m}')">${l}</button>`).join('')}</div><button class="btn btn-sm" onclick="shiftView(-1)">← 上一${viewUnit()}</button><span class="view-range">${view.title}</span><button class="btn btn-sm" onclick="shiftView(0)">今天</button><button class="btn btn-sm" onclick="shiftView(1)">下一${viewUnit()} →</button><button class="btn btn-sm date-lock-btn ${state.dateHeaderLocked?'is-locked':''}" onclick="toggleDateHeaderLock()">${state.dateHeaderLocked?'🔒 日期锁定':'🔓 日期未锁定'}</button><span style="flex:1"></span><span class="muted">点击色块查看或编辑预约</span></div><div class="gantt-wrap" id="timelineGantt">${ganttHtml()}</div>${timelineNavigatorHtml()}</div></div>`;
}
function timelineNavigatorHtml(){
  const config={day:{unit:'小时',limit:48},week:{unit:'天',limit:21},month:{unit:'天',limit:60},year:{unit:'月',limit:18}}[state.viewMode];
  const marks=Array.from({length:7},()=>'<i></i>').join('');
  return `<div class="timeline-navigator"><span class="timeline-label">时间浏览</span><button class="timeline-today" type="button" onclick="jumpTimelineToday()">今天</button><div class="timeline-control"><input type="range" min="-${config.limit}" max="${config.limit}" step="1" value="${state.timelineOffset||0}" oninput="slideTimeline(this.value)" aria-label="拖动浏览前后安排"><div class="timeline-ticks" aria-hidden="true">${marks}</div><div class="timeline-scale"><span>−${config.limit} ${config.unit}</span><span>今天</span><span>+${config.limit} ${config.unit}</span></div></div></div>`;
}

// ---- 甘特图渲染 ----
function ganttHtml(){
  const view = getViewWindow();
  const {start: windowStart, end: windowEnd, cells} = view;
  const today = new Date(); today.setHours(0,0,0,0);

  // 轴头
  let html = `<div class="gantt"><div class="gantt-header"><div class="gantt-header-label">GPU 资源</div><div class="gantt-header-axis" style="grid-template-columns:repeat(${cells.length},1fr)">`;
  cells.forEach(cell => {
    const isToday = cell.start.getTime()===today.getTime();
    html += `<div class="gantt-header-day ${isToday?'today':''}">${cell.label}</div>`;
  });
  html += `</div></div>`;

  const totalMs = windowEnd - windowStart;

  state.gpus.forEach(gpu => {
    html += `<div class="gantt-row"><div class="gantt-label">${gpu.label}</div><div class="gantt-track" style="--grid-cols:${cells.length}" onclick="void(0)">`;
    // 这块 GPU 上的预约
    state.reservations
      // 必须将 API 返回的 ISO 文本转为 Date；直接和 Date 比较会得到 NaN，导致预约全部消失。
      .filter(r => String(r.gpu_id) === String(gpu.id) && new Date(r.end_time) > windowStart && new Date(r.start_time) < windowEnd)
      .forEach(r => {
        const s = Math.max(0, new Date(r.start_time) - windowStart);
        const e = Math.min(totalMs, new Date(r.end_time) - windowStart);
        const leftPct = s/totalMs*100;
        const widthPct = Math.max(1.5,(e-s)/totalMs*100); // 最小宽度避免消失
        const [bg] = colorFor(r.user_id, r.color);
        const isPast = new Date(r.end_time) < new Date();
        const mine = state.user && r.user_id === state.user.id;
        const name = r.display_name + (mine ? ' (我)' : '');
        const label = widthPct >= 16 && r.note ? name + ' · ' + r.note : name;
        html += `<div class="gantt-bar ${isPast?'past':''}"
          style="left:${leftPct}%;width:${widthPct}%;background:${bg}"
          onclick="openReserveModal(${r.id})"
          title="${esc(name)} · ${fmtTime(r.start_time)} → ${fmtTime(r.end_time)}${r.note?'\\n'+esc(r.note):''}">
          ${esc(label)}</div>`;
      });
    html += `</div></div>`;
  });
  html += `</div>`;
  return html;
}

// ============================================================
// 登录 / 注册
// ============================================================
let sendCooldown = 0; // 邮件发送冷却（秒）

async function sendMagicLink(){
  const email = document.getElementById('loginEmail').value.trim();
  const msg = document.getElementById('loginMsg');
  const btn = document.getElementById('sendBtn');
  if(!email){ msg.innerHTML = '<span class="err">请填邮箱</span>'; return; }
  if(sendCooldown > 0){
    msg.innerHTML = `<span class="muted">邮件已发送过，请先去收件箱查收。${sendCooldown} 秒后可重发。</span>`;
    return;
  }

  // 发送中：禁用按钮，防止连点
  btn.disabled = true;
  btn.textContent = '发送中…';
  msg.innerHTML = '<span class="muted">正在发送…</span>';

  const { error } = await sb.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.href }
  });

  if(error){
    btn.disabled = false;
    btn.textContent = '发送登录链接';
    if(/rate limit/i.test(error.message)){
      msg.innerHTML = '<span class="err">发送太频繁被限流，请等几分钟再试，或改用下方 GitHub 登录。</span>';
    } else {
      msg.innerHTML = `<span class="err">发送失败：${esc(error.message)}</span>`;
    }
    return;
  }

  // 成功：显示明确反馈，并进入 60 秒冷却防止重复点击
  msg.innerHTML = `✅ 登录链接已发送到 <b>${esc(email)}</b>，请去收件箱点击。若没收到，60 秒后可重发。`;
  startCooldown(btn, 60);
}

function startCooldown(btn, seconds){
  sendCooldown = seconds;
  btn.textContent = `${seconds} 秒后可重发`;
  const timer = setInterval(() => {
    sendCooldown--;
    if(sendCooldown <= 0){
      clearInterval(timer);
      btn.disabled = false;
      btn.textContent = '重新发送';
    } else {
      btn.textContent = `${sendCooldown} 秒后可重发`;
    }
  }, 1000);
}

async function signInWithGithub(){
  const msg = document.getElementById('loginMsg');
  msg.innerHTML = '<span class="muted">正在跳转 GitHub 授权…</span>';
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'github',
    options: { redirectTo: window.location.href }
  });
  if(error){
    console.error('GitHub 登录失败:', error);
    msg.innerHTML = `<span class="err">GitHub 登录失败：${esc(error.message)}</span>`;

}

async function saveProfile(){
  const name = document.getElementById('profName').value.trim();
  if(!name){ return; }
  const { error } = await sb.from('profiles')
    .upsert({ user_id: state.user.id, display_name: name, created_at: new Date().toISOString() });
  if(error){ alert('保存失败: '+error.message); return; }
  state.profile = { user_id: state.user.id, display_name: name };
  renderMain();
}

async function signOut(){
  await sb.auth.signOut();
  state.user = null; state.profile = null;
  render();
}

// 监听 Auth 状态变化（魔法链接回调）
sb.auth.onAuthStateChange((event, session) => {
  if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user) {
    state.user = session.user; state.profile = null; state.authReady = true; state.dataReady = false; render();
    setTimeout(async () => { try { await refreshData(); state.dataReady = true; render(); } catch(err) { showLoadError(err); } }, 0);
  }
  if (event === 'INITIAL_SESSION' && !session?.user) { setTimeout(() => { if(!state.authReady) { state.authReady = true; render(); } }, 600); }
  if (event === 'SIGNED_OUT') { state.user = null; state.profile = null; state.authReady = true; state.dataReady = true; render(); }
});

// ============================================================
// 预约弹窗（新建 / 编辑 / 删除）
// ============================================================
function openReserveModal(resvId){
  const editing = resvId ? state.reservations.find(r => r.id === resvId) : null;
  const mine = editing && state.user && editing.user_id === state.user.id;
  const defStart = new Date(); defStart.setMinutes(0,0,0); defStart.setHours(defStart.getHours()+1);
  const defEnd = new Date(defStart); defEnd.setHours(defEnd.getHours()+12);
  const selectedIds = editing ? [String(editing.gpu_id)] : [String(state.gpus[0]?.id || '')];
  const gpuDisabled = editing && !mine ? 'disabled' : '';
  const gpuField = editing
    ? `<select id="rGpu" ${gpuDisabled}>${state.gpus.map(g =>
        `<option value="${g.id}" ${String(editing.gpu_id)===String(g.id)?'selected':''}>${esc(g.label)}</option>`
      ).join('')}</select>`
    : `<div class="gpu-picker">${state.gpus.map(g =>
        `<label class="gpu-option"><input type="checkbox" name="rGpu" value="${g.id}" ${selectedIds.includes(String(g.id))?'checked':''} onchange="updateGpuSelectionCount()"><span>${esc(g.label)}</span></label>`
      ).join('')}</div><div class="gpu-count" id="gpuCount">已选 ${selectedIds.filter(Boolean).length} 张卡</div>`;

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <h2>${editing ? (mine?'编辑预约':'预约详情') : '新建预约'}</h2>
        ${editing ? `<div class="muted" style="margin-bottom:12px">预约人：${esc(editing.display_name)}</div>` : ''}
        <input id="resvId" type="hidden" value="${editing?editing.id:''}">
        <div class="field">
          <label>${editing ? 'GPU' : 'GPU（可多选）'}</label>
          ${gpuField}
        </div>
        <div class="field-row">
          <div class="field"><label>开始时间</label><input id="rStart" type="datetime-local" value="${toLocal(editing?new Date(editing.start_time):defStart)}" onchange="syncDateRange('start')"></div>
          <div class="field"><label>结束时间</label><input id="rEnd" type="datetime-local" value="${toLocal(editing?new Date(editing.end_time):defEnd)}" onchange="syncDateRange('end')"></div>
        </div>
        <div class="field">
          <label>备注（可选）</label>
          <input id="rNote" type="text" maxlength="200" placeholder="如：训练 LLaMA-70B"
            value="${editing?esc(editing.note||''):''}" ${editing&&!mine?'disabled':''}>
        </div>
        <div id="conflictWarn"></div>
        <div class="modal-actions">
          ${editing && mine ? `<button class="btn btn-danger btn-sm" onclick="deleteResv(${editing.id})">删除</button>` : ''}
          <button class="btn btn-sm" onclick="closeModal()">取消</button>
          ${mine || !editing ? `<button class="btn btn-primary btn-sm" onclick="saveResev(${editing?editing.id:'null'})">保存</button>` : ''}
        </div>
        <div style="margin-top:8px"><button class="btn btn-sm" onclick="checkConflict()">检查冲突</button></div>
      </div>
    </div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML = ''; }function syncDateRange(changed){
  const startEl=document.getElementById('rStart'), endEl=document.getElementById('rEnd');
  if(!startEl||!endEl) return;
  endEl.min=startEl.value;
  if(startEl.value && endEl.value && new Date(endEl.value)<new Date(startEl.value)){
    if(changed==='start') endEl.value=startEl.value;
    else startEl.value=endEl.value;
  }
}

function selectedGpuIds(){
  const single = document.getElementById('rGpu');
  if(single) return [parseInt(single.value)].filter(Boolean);
  return [...document.querySelectorAll('input[name="rGpu"]:checked')]
    .map(el => parseInt(el.value)).filter(Boolean);
}

function updateGpuSelectionCount(){
  const count = document.getElementById('gpuCount');
  if(count) count.textContent = `已选 ${selectedGpuIds().length} 张卡`;
}

async function checkConflict(){
  const gpuIds = selectedGpuIds();
  const start = new Date(document.getElementById('rStart').value);
  const end = new Date(document.getElementById('rEnd').value);
  if(!gpuIds.length || isNaN(start.getTime()) || isNaN(end.getTime()) || end<=start){
    document.getElementById('conflictWarn').innerHTML = '<div class="warn-box">⚠️ 请至少选择一张卡，且结束须晚于开始。</div>';
    return;
  }
  const editingId = Number(document.getElementById('resvId')?.value || 0);
  const overlaps = state.reservations.filter(r =>
    gpuIds.includes(Number(r.gpu_id)) && Number(r.id)!==editingId &&
    new Date(r.end_time) > start && new Date(r.start_time) < end
  );
  const box = document.getElementById('conflictWarn');
  if(overlaps.length === 0){
    box.innerHTML = '<div class="warn-box" style="background:#dcfce7;border-color:#86efac;color:#166534">✅ 无冲突，所选卡片该时段均空闲。</div>';
  } else {
    const gpuName = id => state.gpus.find(g=>String(g.id)===String(id))?.label || 'GPU';
    const list = overlaps.map(r => `${gpuName(r.gpu_id)} · ${r.display_name}: ${fmtTime(r.start_time)} → ${fmtTime(r.end_time)}`).join('<br>');
    box.innerHTML = `<div class="warn-box">⚠️ 发现 ${overlaps.length} 个重叠预约（仍可提交，靠自行协调）：<br>${list}</div>`;
  }
}
async function saveResev(id){
  const gpuIds = selectedGpuIds();
  const start = document.getElementById('rStart').value;
  const end = document.getElementById('rEnd').value;
  const note = document.getElementById('rNote').value.trim();
  if(!gpuIds.length || !start || !end){ alert('请至少选择一张 GPU 并填完整时间'); return; }
  if(new Date(end) <= new Date(start)){ alert('结束时间须晚于开始时间'); return; }
  if(id && gpuIds.length !== 1){ alert('编辑预约时只能选择一张 GPU'); return; }

  const base = {
    user_id: state.user.id,
    start_time: new Date(start).toISOString(),
    end_time: new Date(end).toISOString(),
    note: note || null
  };
  let res;
  if(id){
    res = await sb.from('reservations').update({...base, gpu_id: gpuIds[0]}).eq('id', id).select();
  } else {
    res = await sb.from('reservations').insert(gpuIds.map(gpu_id => ({...base, gpu_id}))).select();
  }
  if(res.error){ alert('保存失败: '+res.error.message); return; }
  state.viewCenter = new Date(start); state.viewCenter.setHours(0,0,0,0);
  resetTimelineNavigator();
  closeModal(); await loadReservations(); renderMain();
}
async function deleteResv(id){
  if(!confirm('确定删除这条预约？')) return;
  const { error } = await sb.from('reservations').delete().eq('id', id);
  if(error){ alert('删除失败: '+error.message); return; }
  closeModal(); await loadReservations(); renderMain();
}

  try { await Promise.all([loadConfig(), loadReservations(), state.user ? loadProfile() : Promise.resolve()]); render(); }

function openManageModal(){

  const rows=mine.length?mine.map(r=>`<label class="manage-row"><input type="checkbox" name="managedReservation" value="${r.id}"><span><b>${esc(state.gpus.find(g=>String(g.id)===String(r.gpu_id))?.label||'GPU')}</b><small>${fmtTime(r.start_time)} → ${fmtTime(r.end_time)}${r.note?' · '+esc(r.note):''}</small></span></label>`).join(''):'<div class="muted" style="padding:18px 0">你还没有可管理的预约。</div>';

function toggleManagedReservations(checked){document.querySelectorAll('input[name="managedReservation"]').forEach(el=>el.checked=checked)}
async function deleteSelectedReservations(){
  const ids=[...document.querySelectorAll('input[name="managedReservation"]:checked')].map(el=>el.value);
  if(!ids.length)return alert('请先选择预约。'); if(!confirm(`确定删除选中的 ${ids.length} 条预约？`))return;
  const {error}=await sb.from('reservations').delete().in('id',ids).eq('user_id',state.user.id);
  if(error)return alert('删除失败：'+error.message); closeModal(); await loadReservations(); renderMain();
}
// ============================================================
// 视图导航
// ============================================================
function resetTimelineNavigator(){
  state.timelineOrigin = new Date(state.viewCenter);
  state.timelineOffset = 0;
}
let timelineRenderFrame = 0;
function renderTimelineWindow(){
  const ganttEl=document.getElementById('timelineGantt');
  const rangeEl=document.querySelector('.board-panel .view-range');
  if(!ganttEl || !rangeEl){ renderMain(); return; }
  const view=getViewWindow();
  rangeEl.textContent=view.title;
  ganttEl.innerHTML=ganttHtml();
}
function slideTimeline(value){
  const offset=Number(value);
  if(!state.timelineOrigin) state.timelineOrigin = new Date(state.viewCenter);
  const next=new Date(state.timelineOrigin);
  if(state.viewMode === 'day') next.setHours(next.getHours()+offset);
  else if(state.viewMode === 'week') next.setDate(next.getDate()+offset);
  else if(state.viewMode === 'month') next.setDate(next.getDate()+offset);
  else next.setMonth(next.getMonth()+offset);
  state.timelineOffset=offset; state.viewCenter=next;
  if(timelineRenderFrame) cancelAnimationFrame(timelineRenderFrame);
  timelineRenderFrame=requestAnimationFrame(()=>{ timelineRenderFrame=0; renderTimelineWindow(); });
}
function jumpTimelineToday(){
  state.viewCenter = new Date(); state.viewCenter.setHours(0,0,0,0);
  resetTimelineNavigator(); renderMain();
}
function shiftView(days){
  if(days === 0){ state.viewCenter = new Date(); state.viewCenter.setHours(0,0,0,0); }
  else if(state.viewMode === 'day') state.viewCenter.setDate(state.viewCenter.getDate()+days);
  else if(state.viewMode === 'week') state.viewCenter.setDate(state.viewCenter.getDate()+days*7);
  else if(state.viewMode === 'month') state.viewCenter.setMonth(state.viewCenter.getMonth()+days);
  else state.viewCenter.setFullYear(state.viewCenter.getFullYear()+days);
  resetTimelineNavigator(); renderMain();
}

function toggleDateHeaderLock(){
  state.dateHeaderLocked = !state.dateHeaderLocked;
  try { localStorage.setItem('gpu-board-date-header-locked', String(state.dateHeaderLocked)); } catch {}
  renderMain();
}
function setViewMode(mode){ state.viewMode = mode; resetTimelineNavigator(); renderMain(); }
function viewUnit(){ return {day:'日',week:'周',month:'月',year:'年'}[state.viewMode]; }

function getViewWindow(){
  const anchor = new Date(state.viewCenter);
  if(state.viewMode !== 'day') anchor.setHours(0,0,0,0);
  let start, end, cells = [];
  if(state.viewMode === 'day'){
    // 日视图为连续 24 小时窗口，可跨越午夜查看后续安排。
    start = anchor; end = new Date(start); end.setHours(end.getHours()+24);
    for(let hour=0;hour<24;hour++){
      const d=new Date(start); d.setHours(d.getHours()+hour);
      const prefix=(hour===0 || d.getHours()===0) ? (d.getMonth()+1)+'/'+d.getDate()+' ' : '';
      cells.push({start:d,label:prefix+String(d.getHours()).padStart(2,'0')+':00'});
    }
  } else if(state.viewMode === 'week'){
    // 周视图是可平移的连续 7 日窗口，允许同时浏览本周与下周的安排。
    start = new Date(anchor);
    end = new Date(start); end.setDate(end.getDate()+7);
    for(let i=0;i<7;i++){ const d=new Date(start); d.setDate(d.getDate()+i); cells.push({start:d,label:fmtDay(d)}); }
  } else if(state.viewMode === 'month'){
    // 月视图为连续 30 天窗口，可从月中平滑延展到下月。
    start = new Date(anchor); end = new Date(start); end.setDate(end.getDate()+30);
    for(let d=new Date(start);d<end;d.setDate(d.getDate()+1)) cells.push({start:new Date(d),label:(d.getMonth()+1)+'/'+d.getDate()});
  } else {
    // 年视图为连续 12 个月窗口，可从任意月份平滑跨年。
    start = new Date(anchor.getFullYear(),anchor.getMonth(),1); end = new Date(start); end.setMonth(end.getMonth()+12);
    for(let month=0;month<12;month++){ const d=new Date(start); d.setMonth(d.getMonth()+month); cells.push({start:d,label:d.getFullYear()+'/'+(d.getMonth()+1)}); }
  }
  const last = new Date(end-1);
  const title = state.viewMode === 'day' ? `${fmtDate(start)} ${String(start.getHours()).padStart(2,'0')}:00 — ${fmtDate(last)} ${String(last.getHours()).padStart(2,'0')}:59` :
    state.viewMode === 'week' ? `${fmtDate(start)} — ${fmtDate(last)}` :
    state.viewMode === 'month' ? `${fmtDate(start)} — ${fmtDate(last)}` : `${start.getFullYear()}/${start.getMonth()+1} — ${last.getFullYear()}/${last.getMonth()+1}`;
  return {start,end,cells,title};
}

// ============================================================
// 工具函数
// ============================================================
function fmtDay(d){ return (d.getMonth()+1)+'/'+d.getDate()+' '+['日','一','二','三','四','五','六'][d.getDay()]; }
function fmtDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(iso){
  const d = new Date(iso);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function toLocal(d){
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,16);
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
